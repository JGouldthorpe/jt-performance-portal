<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JT Performance Portal</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; color: #38bdf8; }
    p { color: #94a3b8; font-size: 0.95rem; }
    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      margin-top: 15px;
    }
    button:hover { background: #0369a1; }
  </style>
</head>
<body>

  <div class="card">
    <h1>JT Performance Portal</h1>
    <p>Foundation Phase — Real-time Cloud Sync Active.</p>
    <button onclick="testSave()">Log Test Workout</button>
  </div>

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    // Live Firebase Config Credentials
    const firebaseConfig = {
      apiKey: "AIzaSyDlYo3gUuK6-NUqSegB4e2DNcYuh4K_zFw",
      authDomain: "jt-performance-portal.firebaseapp.com",
      projectId: "jt-performance-portal",
      storageBucket: "jt-performance-portal.firebasestorage.app",
      messagingSenderId: "514340641320",
      appId: "1:514340641320:web:8bf0253ea4cecc2249f31d",
      measurementId: "G-YWK8GLJ149"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Cloud Logging Function
    function testSave() {
      db.collection("workout_history").add({
        workout: "Full Body A - Test",
        completedAt: firebase.firestore.FieldValue.serverTimestamp()
      })
      .then(() => alert("Workout logged successfully to Cloud Firestore!"))
      .catch((error) => alert("Error saving workout: " + error.message));
    }

    // Register PWA Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Service Worker Registered'));
    }
  </script>
</body>
</html>
