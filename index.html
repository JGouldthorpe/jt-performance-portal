<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JT Performance Portal</title>
  
  <!-- PWA Manifest & Theme -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Chart.js CDN for Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent-green: #4ade80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      max-width: 800px;
      margin-bottom: 20px;
      text-align: center;
    }

    h1 {
      font-size: 1.75rem;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    h2 {
      font-size: 1.25rem;
      color: var(--primary);
      margin-bottom: 12px;
    }

    label {
      display: block;
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 6px;
    }

    select, input, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }

    button {
      background-color: var(--primary-hover);
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-top: 10px;
    }

    button:hover {
      background-color: var(--primary);
    }

    .chart-container {
      position: relative;
      height: 300px;
      width: 100%;
      margin: 20px 0;
    }

    .table-container {
      overflow-x: auto;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th {
      color: var(--text-muted);
      border-bottom: 2px solid var(--border-color);
      padding: 10px 8px;
    }

    td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .weight-col {
      color: var(--primary);
      font-weight: bold;
    }

    .e1rm-col {
      color: var(--accent-green);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>JT Performance Portal</h1>
    <p class="subtitle">Phase 1: Foundation — Cloud Sync & Movement Analytics</p>
  </header>

  <main class="container">
    
    <!-- Quick Entry Section -->
    <section class="card">
      <h2>Log Workout Session</h2>
      <form id="workoutForm" onsubmit="handleWorkoutSubmit(event)">
        <div style="margin-bottom: 12px;">
          <label for="logExercise">Exercise Movement:</label>
          <select id="logExercise" required>
            <option value="Romanian Deadlift">Romanian Deadlift (DB/BB)</option>
            <option value="Goblet Box Squat">Goblet Box Squat</option>
            <option value="Dumbbell Neutral Press">Dumbbell Neutral Press</option>
            <option value="Single-Arm DB Row">Single-Arm DB Row</option>
            <option value="Bulgarian Split Squat">Bulgarian Split Squat</option>
            <option value="Reverse Lunge">Reverse Lunge</option>
          </select>
        </div>

        <div style="display: flex; gap: 12px; margin-bottom: 12px;">
          <div style="flex: 1;">
            <label for="logWeight">Top Weight (lbs):</label>
            <input type="number" id="logWeight" placeholder="e.g. 185" required min="0">
          </div>
          <div style="flex: 1;">
            <label for="logReps">Reps Completed:</label>
            <input type="number" id="logReps" placeholder="e.g. 10" required min="1">
          </div>
        </div>

        <button type="submit">Save Session to Cloud</button>
      </form>
    </section>

    <!-- Movement Analytics Section -->
    <section class="card">
      <h2>Performance Trends</h2>
      <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 16px;">
        Track top working weight and safe Estimated 1RM ($Weight \times (1 + \frac{Reps}{30})$) over time.
      </p>

      <div>
        <label for="exerciseSelect">Select Movement Trend:</label>
        <select id="exerciseSelect" onchange="renderExerciseTrend()">
          <option value="Romanian Deadlift">Romanian Deadlift (DB/BB)</option>
          <option value="Goblet Box Squat">Goblet Box Squat</option>
          <option value="Dumbbell Neutral Press">Dumbbell Neutral Press</option>
          <option value="Single-Arm DB Row">Single-Arm DB Row</option>
          <option value="Bulgarian Split Squat">Bulgarian Split Squat</option>
          <option value="Reverse Lunge">Reverse Lunge</option>
        </select>
      </div>

      <div class="chart-container">
        <canvas id="trendChart"></canvas>
      </div>

      <h3 style="font-size: 1rem; color: var(--primary); margin-top: 10px;">Lift History Log</h3>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Top Weight</th>
              <th>Reps</th>
              <th>Est. 1RM</th>
            </tr>
          </thead>
          <tbody id="historyTableBody">
            <!-- Dynamic Rows -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    // Live Firebase Credentials
    const firebaseConfig = {
      apiKey: "AIzaSyDlYo3gUuK6-NUqSegB4e2DNcYuh4K_zFw",
      authDomain: "jt-performance-portal.firebaseapp.com",
      projectId: "jt-performance-portal",
      storageBucket: "jt-performance-portal.firebasestorage.app",
      messagingSenderId: "514340641320",
      appId: "1:514340641320:web:8bf0253ea4cecc2249f31d",
      measurementId: "G-YWK8GLJ149"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let performanceChart = null;

    // Epley Formula for Safe Estimated 1RM
    function calculateE1RM(weight, reps) {
      if (!weight || !reps) return 0;
      if (Number(reps) === 1) return Number(weight);
      return Math.round(Number(weight) * (1 + Number(reps) / 30));
    }

    // Submit New Session to Firestore
    async function handleWorkoutSubmit(e) {
      e.preventDefault();
      const exerciseName = document.getElementById('logExercise').value;
      const weight = Number(document.getElementById('logWeight').value);
      const reps = Number(document.getElementById('logReps').value);

      try {
        await db.collection("workout_history").add({
          timestamp: firebase.firestore.FieldValue.serverTimestamp(),
          exercises: [
            {
              name: exerciseName,
              sets: [{ weight: weight, reps: reps }]
            }
          ]
        });

        alert("Workout logged successfully!");
        document.getElementById('workoutForm').reset();
        renderExerciseTrend();
      } catch (err) {
        console.error("Error logging workout: ", err);
        alert("Failed to log workout: " + err.message);
      }
    }

    // Render Chart.js Trend and Detail Table
    async function renderExerciseTrend() {
      const selectedExercise = document.getElementById('exerciseSelect').value;
      const historyTableBody = document.getElementById('historyTableBody');
      historyTableBody.innerHTML = '';

      const dates = [];
      const topWeights = [];
      const estimated1RMs = [];

      try {
        const snapshot = await db.collection("workout_history")
          .orderBy("timestamp", "asc")
          .get();

        snapshot.forEach(doc => {
          const data = doc.data();
          if (!data.exercises || !data.timestamp) return;

          const exerciseData = data.exercises.find(e => e.name === selectedExercise);
          
          if (exerciseData && exerciseData.sets && exerciseData.sets.length > 0) {
            const dateStr = new Date(data.timestamp.toDate()).toLocaleDateString('en-US', { 
              month: 'short', 
              day: 'numeric' 
            });
            
            const maxWeight = Math.max(...exerciseData.sets.map(s => Number(s.weight) || 0));
            const bestSet = exerciseData.sets.find(s => Number(s.weight) === maxWeight) || exerciseData.sets[0];
            const e1rm = calculateE1RM(maxWeight, bestSet.reps);

            dates.push(dateStr);
            topWeights.push(maxWeight);
            estimated1RMs.push(e1rm);

            const row = `
              <tr>
                <td>${dateStr}</td>
                <td class="weight-col">${maxWeight} lbs</td>
                <td>${bestSet.reps}</td>
                <td class="e1rm-col">${e1rm} lbs</td>
              </tr>
            `;
            historyTableBody.innerHTML += row;
          }
        });

        // Destroy prior chart instance before re-drawing
        if (performanceChart) {
          performanceChart.destroy();
        }

        const ctx = document.getElementById('trendChart').getContext('2d');
        performanceChart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: dates,
            datasets: [
              {
                label: 'Top Weight (lbs)',
                data: topWeights,
                borderColor: '#38bdf8',
                backgroundColor: 'rgba(56, 189, 248, 0.15)',
                borderWidth: 3,
                pointRadius: 4,
                tension: 0.3,
                fill: true
              },
              {
                label: 'Est. 1RM Trend (lbs)',
                data: estimated1RMs,
                borderColor: '#4ade80',
                borderDash: [5, 5],
                borderWidth: 2,
                pointRadius: 3,
                tension: 0.3,
                fill: false
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { labels: { color: '#94a3b8' } }
            },
            scales: {
              x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
              y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
            }
          }
        });

      } catch (error) {
        console.error("Error loading analytics: ", error);
      }
    }

    // Initialize PWA Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    // Load initial trend on page startup
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(renderExerciseTrend, 800);
    });
  </script>
</body>
</html>
